<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824px tile centred on the 1024px canvas. -->
  <!-- One disc cut down the middle: A on the left, B on the right, B nudged
       out of line like a layout diff. Colours are the toolbar's. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a" />
      <stop offset="1" stop-color="#151515" />
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="497" height="1024" /></clipPath>
    <clipPath id="right"><rect x="527" y="0" width="497" height="1024" /></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
  <circle cx="512" cy="512" r="250" fill="#e8e8e8" clip-path="url(#left)" />
  <circle cx="512" cy="472" r="250" fill="#e5603b" clip-path="url(#right)" />
  <!-- the dashed line where A sits, behind B's shifted half -->
  <circle cx="512" cy="512" r="245" fill="none" stroke="#e5603b" stroke-opacity="0.5"
          stroke-width="10" stroke-dasharray="24 18" clip-path="url(#right)" />
</svg>
